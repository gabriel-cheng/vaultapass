spring.config.import=optional:file:.env[.properties]
spring.application.name=vaultaPass

spring.datasource.url=jdbc:postgresql://localhost:5432/vaultapass
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

logging.level.org.springframework.security=DEBUG

app.encryption.secret-key=${ENCRYPTION_SECRET_KEY}

app.storage.s3.endpoint=${GARAGE_S3_ENDPOINT}
app.storage.s3.region=${GARAGE_S3_REGION}
app.storage.s3.bucket=${GARAGE_S3_BUCKET}
app.storage.s3.access-key=${GARAGE_S3_ACCESS_KEY}
app.storage.s3.secret-key=${GARAGE_S3_SECRET_KEY}
app.storage.s3.public-base-url=${GARAGE_S3_PUBLIC_BASE_URL}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=10

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB