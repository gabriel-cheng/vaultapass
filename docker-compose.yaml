services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: vaultapass
      POSTGRES_USER: "${DATABASE_USERNAME}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d vaultapass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultapass-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaultapass
      SPRING_DATASOURCE_USERNAME: "${DATABASE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DATABASE_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      GARAGE_S3_ENDPOINT: "${GARAGE_S3_ENDPOINT}"
      GARAGE_S3_REGION: "${GARAGE_S3_REGION}"
      GARAGE_S3_BUCKET: "${GARAGE_S3_BUCKET}"
      GARAGE_S3_ACCESS_KEY: "${GARAGE_S3_ACCESS_KEY}"
      GARAGE_S3_SECRET_KEY: "${GARAGE_S3_SECRET_KEY}"
      GARAGE_S3_PUBLIC_BASE_URL: "${GARAGE_S3_PUBLIC_BASE_URL}"

    ports:
      - "8080:8080"

volumes:
  postgres_data: